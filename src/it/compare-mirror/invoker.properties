# Invoker interpolates settings by filename in a shared directory; keep this distinct from settings.xml.
invoker.settingsFile=${basedir}/src/it/compare-mirror/mirror-settings.xml
invoker.goals.1=clean install
invoker.goals.2=clean verify artifact:compare
invoker.goals.3=clean verify artifact:compare -Dreference.repo=mirror-central
invoker.goals.4=clean verify artifact:compare -Dreference.repo=${localRepositoryUrl}
invoker.goals.5=clean verify artifact:compare -Dreference.repo=reference::${localRepositoryUrl}
invoker.goals.6=clean verify artifact:compare -Dreference.repo=unknown
invoker.buildResult.6=failure
